
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header & Navigation Bar</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div class="flex items-center justify-between h-16">

                <!-- Logo -->
                <div class="text-2xl font-bold">
                    MyWebsite
                </div>

                <!-- Navigation Menu -->
                <nav class="hidden md:flex items-center space-x-6">

                    <a href="#" class="hover:text-blue-200 transition">
                        Home
                    </a>

                    <a href="#" class="hover:text-blue-200 transition">
                        About
                    </a>

                    <!-- Dropdown -->
                    <div class="relative group">

                        <button class="flex items-center gap-1 hover:text-blue-200 transition">
                            Services
                            <span class="text-sm">▼</span>
                        </button>

                        <!-- Dropdown Menu -->
                        <div class="absolute left-0 top-full mt-2 w-44 bg-white text-gray-700 rounded-lg shadow-lg 
                                    opacity-0 invisible group-hover:opacity-100 group-hover:visible 
                                    transition duration-200">

                            <a href="#" class="block px-4 py-3 hover:bg-blue-50 hover:text-blue-600">
                                Web Design
                            </a>

                            <a href="#" class="block px-4 py-3 hover:bg-blue-50 hover:text-blue-600">
                                App Development
                            </a>

                            <a href="#" class="block px-4 py-3 hover:bg-blue-50 hover:text-blue-600">
                                Digital Marketing
                            </a>

                        </div>
                    </div>

                    <a href="#" class="hover:text-blue-200 transition">
                        Contact
                    </a>

                </nav>

                <!-- Login Button -->
                <button class="hidden md:block bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-blue-100 transition">
                    Login
                </button>

                <!-- Mobile Menu Icon -->
                <button class="md:hidden text-2xl">
                    ☰
                </button>

            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto text-center py-20 px-4">
        <h1 class="text-4xl font-bold text-gray-800">
            Welcome to My Website
        </h1>

        <p class="text-gray-600 mt-4">
            Responsive Header and Navigation Bar with Dropdown using Tailwind CSS.
        </p>
    </main>

</body>
</html>
